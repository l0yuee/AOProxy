# AOProxy English catalog
# Keys must match zh-CN.toml exactly; a core unit test compares the two key sets.

[app]
name = "AOProxy"

[mode]
forward = "forward"
reverse = "reverse"

[upstream]
direct = "direct"
http = "HTTP"
https = "HTTPS"
socks5 = "SOCKS5"

[auth]
none = "no auth"
basic = "basic auth"
token = "path token"

[label]
tls = "TLS"
auth = "auth"
upstream = "upstream"

[state]
stopped = "stopped"
starting = "starting"
running = "running"
failed = "failed"

[log]
banner = "{app} {version}"
config_path = "config file: {path}"
rule_listening = "listening on {addr} · {detail}"
rule_stopped = "stopped"
rule_failed = "failed to start: {reason}"
no_rules = "no rules enabled"
all_stopped = "all rules stopped"
shutdown = "shutting down…"
conn_open = "{peer} → {target}"
tunnel_open = "← tunnel established {ms}ms"
tunnel_close = "⇄ closed ↑{up} ↓{down} {dur}"
request = "→ {method} {path}"
response = "← {status} · {dur}{extra}"
auth_failed = "{peer} authentication failed"
upstream_dial = "via upstream {kind} {address}"
reload = "configuration reloaded"

[err]
config_dir = "cannot determine the config directory"
config_read = "cannot read config file {path}"
config_write = "cannot write config file {path}"
config_parse = "malformed config file {path}"
config_serialize = "failed to serialize config"
config_version = "config version {found} is not supported, this build understands version {expected}"
rule_invalid = "rule {id} is misconfigured: {reason}"
duplicate_id = "duplicate rule id: {id}"
listen_conflict = "rules {first} and {second} listen on the same address {addr}"
unknown_rule = "no such rule: {id}"
bind = "rule {id} cannot bind {addr}"
already_running = "rule {id} is already running"
tls_file_read = "cannot read TLS file {path}"
tls_no_cert = "no certificate found in {path}"
tls_no_key = "no private key found in {path}"
tls = "TLS initialization failed"
io = "I/O error"
upstream_unreachable = "upstream {address} is unreachable"
socks = "SOCKS5 upstream error"
upstream_rejected = "upstream proxy rejected CONNECT {target} with status {status}"
invalid_address = "malformed address: {address}"
autostart = "cannot change the launch-at-login setting"
# Errors with an underlying cause: {message} is one of the entries above,
# {cause} is what the OS or the parser reported.
with_cause = "{message}: {cause}"

[valid]
id_empty = "rule id must not be empty"
id_charset = "rule id may only contain letters, digits, hyphens and underscores"
listen_invalid = "malformed listen address, expected host:port"
target_required = "reverse mode requires a target address"
target_invalid = "target address is not a valid URL"
target_scheme = "target address must start with http:// or https://"
target_host = "target address has no host"
upstream_address = "malformed upstream address, expected host:port"
upstream_auth = "upstream username and password must both be set"
auth_basic_incomplete = "basic auth requires both a username and a password"
auth_token_empty = "token must not be empty"
auth_token_forward = "path tokens only apply to reverse mode; use basic auth for forward mode"
tls_incomplete = "certificate and private key must both be set"
tls_cert_missing = "certificate file not found: {path}"
tls_key_missing = "private key file not found: {path}"

[cli]
config_written = "wrote config file {path}"
config_exists = "config file already exists, left untouched: {path}"
config_exists_hint = "to overwrite, delete the file first"
config_ok = "config is valid, {count} rule(s)"
config_invalid = "invalid config: {reason}"
running = "{count} rule(s) running, press Ctrl+C to quit"
error = "error: {reason}"
all_failed = "all rules failed to start, exiting"
config_missing_hint = "run `aoproxy config init` to create an example config, or pass -c <FILE>"

