# AOProxy 简体中文词条
# 键与 en-US.toml 必须一一对应，core 的单元测试会校验两边键集一致。

[app]
name = "AOProxy"

[mode]
forward = "正向"
reverse = "反向"

[upstream]
direct = "直连"
http = "HTTP"
https = "HTTPS"
socks5 = "SOCKS5"

[auth]
none = "无认证"
basic = "Basic 认证"
token = "路径令牌"

[label]
tls = "TLS"
auth = "认证"
