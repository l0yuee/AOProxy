[package]
name = "aoproxy-gui"
description = "AOProxy desktop GUI — Qt 6 via cxx-qt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "aoproxy-gui"
path = "src/main.rs"
# 主程序不生成空单元测试目标。GUI 设置恢复测试在 tests/recovery_settings.rs，
# 托盘菜单另由 Qt Quick Test 覆盖；Windows 下运行测试需让 Qt DLL 可被找到，
# 命令见 README 的「测试」一节。
test = false

[dependencies]
aoproxy-core.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
# 规则与设置表单在 QML 与 Rust 之间以 JSON 传递：QML 原生有 JSON.stringify，
# 而 cxx-qt 无法直接跨界传 Rust 结构体。
serde_json.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true
