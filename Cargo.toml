[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.88 不是随手写的下限：依赖里的 time 0.3.55 与 cxx 1.0.202 自己就要求 1.88。
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/aoproxy/aoproxy"
authors = ["AOProxy Contributors"]

[workspace.dependencies]
aoproxy-core = { path = "crates/core" }

# async runtime
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

# http
hyper = { version = "1.11", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "server", "http1", "http2"] }
http = "1.3"
http-body-util = "0.1"
bytes = "1.10"

# socks5
# 服务端协议在 engine::forward 中手写，客户端侧用 tokio-socks 拨号。
tokio-socks = "0.5"

# tls
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.12"
webpki-roots = "1.0"

# config
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
# GUI 侧规则编辑器用 JSON 在 QML 与 Rust 之间传结构体：QML 原生有 JSON.stringify，
# 而 cxx-qt 无法直接跨界传 Rust 结构体。
serde_json = "1.0"

# cli
clap = { version = "4.6", features = ["derive", "wrap_help"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "time", "local-time"] }

# misc
anyhow = "1.0"
thiserror = "2.0"
directories = "6.0"
base64 = "0.22"
parking_lot = "0.12"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

# gui
# cxx 必须是 GUI crate 的直接依赖：cxx-qt 生成的桥接代码里带 #[cxx::bridge]，
# 只靠传递依赖的话这个属性宏在 crate 里解析不到。
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
cxx-qt-build = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
